# LocalVoice configuration.
# All pipeline stages read from this file — nothing below should be hardcoded
# elsewhere in the codebase.

llm:
  base_url: "http://localhost:1234/v1"   # LM Studio's OpenAI-compatible server
  model: "google/gemma-4-26b-a4b-qat"  # see `lms ps` once a model is loaded
  system_prompt: >
    You are a concise, helpful voice assistant. Keep responses short and
    conversational, since they will be spoken aloud rather than read.
  temperature: 0.7

stt:
  # A whisper.cpp `server` binary running separately, holding a ggml model
  # resident in memory. See README.md for how to start it.
  whisper_server_url: "http://localhost:8081"
  language: "en"

tts:
  engine: "piper"
  piper_binary: "piper"          # resolves to venv/bin/piper once the venv is activated
  piper_model: "voices/en_GB-southern_english_female-low.onnx"
  piper_model_config: "voices/en_GB-southern_english_female-low.onnx.json"
  speaker: null                   # speaker id for multi-speaker voices (e.g. libritts); ignored by single-speaker voices

vad:
  speech_prob_threshold: 0.5     # Silero VAD speech probability cutoff
  silence_hangover_ms: 700       # trailing silence before a turn is considered over
  min_speech_ms: 500              # ignore blips shorter than this (coughs, taps)

barge_in:
  # Stricter than vad's own thresholds above, on top of echo cancellation
  # below rather than instead of it — belt and suspenders. Measured: with
  # speakers and mic on the same machine, raw mic input during TTS
  # playback sustained ~1.0 VAD confidence for 3.26s straight (this used
  # to self-interrupt after ~64ms). At 0.9/16, a real reply ("explain the
  # Monty Hall paradox") still false-triggered 1/15 live runs (~6.7%),
  # 3.76s in — past grace_period_ms below, not during it. Logged full
  # per-chunk probability traces across 20 replays to find real margin
  # rather than guessing: both observed false triggers came within 1
  # chunk of still crossing even 0.93/16 (15/16 consecutive), so 0.93 and
  # 24 are used together for real headroom rather than either bare
  # minimum. Confirmed 0/20 replays of the same logged traces at these
  # settings, then re-verified live (fresh trials, not just trace
  # replay).
  prob_threshold: 0.93
  consecutive_frames: 24           # ~768ms sustained -- applies AFTER the grace period below

  # The adaptive filter needs a couple of seconds of real audio to converge.
  # Across repeated live test runs, every false trigger happened within the
  # first ~1.8s of a reply and never after -- so barge-in is simply disabled
  # (not just stricter) for grace_period_ms at the start of each reply, while
  # the canceller still runs and converges. No interruption at all is
  # possible in that window, but it's a couple of seconds, not the whole reply.
  grace_period_ms: 2000

  echo_cancel:
    enabled: true
    # NLMS adaptive filter (audio/echo_cancel.py) that predicts the echo
    # from the known reference (playback) signal and subtracts it before
    # scoring. A first attempt anchored expected_delay_ms tightly to a
    # single cross-correlation measurement (~410ms) with a narrow +150ms
    # window; it worked great replayed against the exact recording it was
    # measured on, but failed live in a fresh session (delay apparently
    # isn't perfectly stable run to run). Widening the window to bracket
    # the whole plausible range (50-650ms) and raising mu close to NLMS's
    # stability limit (2.0) so it converges fast enough within that wider
    # window is what actually held up across repeated live tests -- a
    # 6/8 pass rate on its own, both failures within the first ~1.8s (see
    # grace_period_ms above, added specifically to close that gap).
    # Loosen expected_delay_ms/filter_length_ms further
    # further (at some real-time compute cost) if it's still unreliable
    # on a different machine.
    expected_delay_ms: 50
    filter_length_ms: 600
    mu: 1.9                          # NLMS step size, must stay under 2.0 (theoretical stability limit)

wake_word:
  enabled: true
  phrase: "gemma"                 # soft-g "Gemma" — matches the LLM model's name
  silence_before_ms: 1500          # required quiet stretch before a wake-word attempt is even considered
  silence_hangover_ms: 300         # trailing silence to end the wake-word utterance — kept short so
                                    # continuing straight into your query doesn't feel like a long pause,
                                    # but the remainder-after-the-phrase handling below means the exact
                                    # value here mostly affects the gap between "no pause" and "one pause"
  min_speech_ms: 150               # a wake word is much shorter than a normal utterance
  # Music/background noise is filtered two ways: Silero VAD has to think it's speech at
  # all, AND (since this only ever looks at short candidates following real silence) it
  # then has to transcribe to the exact phrase — a stray VAD trigger from a song essentially
  # never comes back from whisper.cpp as "gemma". If VAD itself is triggering on music
  # often, raise vad.speech_prob_threshold or vad.min_speech_ms instead.

  # Easy to say the wake word and then forget what you meant to ask. If
  # nothing is said at all within command_timeout_ms of the wake word,
  # or the whole command is just one of cancel_phrases (exact match, not
  # substring -- "cancel my 3pm meeting" still goes through), give up and
  # go back to waiting for the wake word instead of leaving the mic
  # "listening" indefinitely.
  command_timeout_ms: 3000
  cancel_phrases: ["cancel", "nevermind", "never mind", "forget it"]

audio:
  sample_rate: 16000              # required by Silero VAD and whisper.cpp
  channels: 1
  input_device: null               # sounddevice device index; null = system default
  output_device: null

noise_reduction:
  # For highway-speed vehicle use. No noise sample was available to
  # calibrate against, so these are reasoned from documented vehicle
  # cabin acoustics (highway cabin noise ~65-71 dB(A), peaking 100-500Hz)
  # and validated against a synthetic noise proxy shaped to that same
  # spectrum, not a real recording -- retune once tested in the actual
  # vehicle. See audio/noise_reduce.py's module docstring for the full
  # reasoning, including a real tuning mistake found and fixed along the
  # way (a naive noise estimate got contaminated by speech energy and
  # made transcription worse, not better, until fixed).
  enabled: false
  highpass_hz: 100                 # cuts deep engine/structural rumble unconditionally; 0 disables this stage
  oversubtraction: 1.2             # how aggressively to subtract the estimated noise spectrum; higher = more suppression, more "musical noise" artifact risk
  spectral_floor: 0.1              # minimum gain per frequency bin (0-1); prevents bins being zeroed out entirely
  noise_update_rate: 0.05          # how fast the noise estimate adapts to changing conditions (e.g. speeding up/slowing down)

tools:
  browser:
    enabled: false
    # Isolated Brave profile, started logged out of everything — separate
    # from your everyday Brave profile/cookies. See scripts/prime_browser_profile.py
    # to selectively copy specific site logins into it if a tool call needs one.
    profile_dir: "~/.localvoice/brave-profile"
    headless: true                # true = no visible window; the tool runs in the background
    timeout_ms: 15000
